<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jenkins + Docker Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #fff;
      padding: 40px 60px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 { color: #2c3e50; margin-bottom: 8px; }
    p  { color: #666; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello from Jenkins + Docker 🚀</h1>
    <p>This page was built and deployed by a Jenkins pipeline.</p>
  </div>
</body>
</html>
